<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Moozg · Panel licencji</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    main {
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #f8fafc;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.8125rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.5rem;
    }

    .btn-primary {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: #2456ad;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      padding: 0.75rem 1.25rem;
      border-radius: 7px;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: #2563eb; }

    .btn-primary:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    .note {
      font-size: 0.8125rem;
      color: #94a3b8;
      margin-top: 1rem;
      line-height: 1.6;
    }

  </style>
</head>
<body>
  <main>
    <h1>Moozg</h1>
    <p class="subtitle">Zakładka właściciela · Panel licencji</p>

    <div class="card">
      <a href="https://moozg-licencje.netlify.app/panel" class="btn-primary">Otwórz panel licencji</a>

      <p class="note">
        Zaloguj się hasłem właściciela, aby zarządzać licencjami i&nbsp;komunikatami Moozg.
      </p>
    </div>
  </main>
</body>
</html>
